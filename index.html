<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf3f9" />
    <meta name="description" content="Generador aleatorio de secuencias angulares con temporizador." />
    <title>Secuencias angulares · Generador</title>
    <style>
:root {
  color-scheme: light;
  --ink: #17283a;
  --muted: #77899b;
  --paper: #edf3f9;
  --blue-deep: #123c70;
  --blue: #1763b4;
  --blue-light: #3d8fe0;
  font-family: Manrope, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { min-width: 320px; min-height: 100%; background: var(--paper); }
body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--ink); background: radial-gradient(ellipse at 50% 39%, #fff 0, #f5f8fb 34%, var(--paper) 76%); }
button { font: inherit; }
button:focus-visible { outline: 3px solid #73b7fa; outline-offset: 3px; }
.sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }

.workbench { display: flex; width: 100%; min-height: 100vh; min-height: 100svh; align-items: center; justify-content: center; padding: 4vh 3vw; }
.device { position: relative; display: flex; width: min(94vw, 1200px); height: min(90vh, 900px); height: min(90svh, 900px); min-height: 600px; flex-direction: column; padding: clamp(18px, 3vh, 32px) clamp(18px, 3vw, 36px) clamp(14px, 2vh, 24px); border: 1px solid #1c518b; border-radius: clamp(24px, 3vw, 42px); background: linear-gradient(145deg, #1a4d84, #0d315d 70%, #164879); box-shadow: 0 26px 60px rgba(30, 71, 113, .22), inset 0 1px rgba(255, 255, 255, .24), inset 0 -4px rgba(4, 26, 53, .25); }
.bezel-top { display: flex; height: clamp(34px, 6vh, 58px); flex: 0 0 auto; align-items: center; justify-content: space-between; padding: 0 clamp(8px, 1vw, 16px) 8px; color: #d1e5fb; }
.device-name { font: 500 clamp(11px, 1.15vw, 16px) 'DM Mono', ui-monospace, monospace; letter-spacing: .2em; }
.device-led { width: clamp(8px, .8vw, 12px); height: clamp(8px, .8vw, 12px); border-radius: 50%; background: #74d7bb; box-shadow: 0 0 8px rgba(116, 215, 187, .55); }
.device-screen { position: relative; display: flex; min-height: 0; flex: 1 1 auto; flex-direction: column; justify-content: space-between; overflow: hidden; padding: clamp(24px, 4vh, 48px) clamp(22px, 4vw, 60px); border: 1px solid rgba(193, 225, 255, .45); border-radius: clamp(16px, 2vw, 26px); color: #fff; background: linear-gradient(145deg, #226fc2 0%, #1558a8 53%, #0e4b93 100%); box-shadow: inset 0 1px 10px rgba(7, 42, 87, .32), 0 2px rgba(255, 255, 255, .12); }
.device-screen::before { position: absolute; inset: 0; content: ''; pointer-events: none; background: linear-gradient(120deg, rgba(255, 255, 255, .07), transparent 35% 72%, rgba(2, 24, 61, .08)); }
.screen-topline { position: relative; display: flex; align-items: center; justify-content: space-between; color: rgba(232, 244, 255, .76); font: 500 clamp(12px, 1.2vw, 17px) 'DM Mono', ui-monospace, monospace; letter-spacing: .17em; }
.screen-mark { color: #8fe0c0; font-size: clamp(10px, 1vw, 14px); text-shadow: 0 0 8px rgba(143, 224, 192, .7); }
.sequence-output { position: relative; display: flex; min-height: 150px; flex: 1 1 auto; align-items: center; justify-content: center; gap: clamp(10px, 2vw, 28px); padding: 24px 0; white-space: nowrap; }
.sequence-angle { color: #fff; font-size: clamp(30px, 6vw, 76px); font-weight: 700; letter-spacing: -.055em; font-variant-numeric: tabular-nums; text-shadow: 0 1px 1px rgba(3, 32, 67, .14); animation: angle-in .32s cubic-bezier(.2, .8, .2, 1) both; }
.sequence-angle:nth-child(1) { animation-delay: 0ms; }
.sequence-angle:nth-child(3) { animation-delay: 35ms; }
.sequence-angle:nth-child(5) { animation-delay: 70ms; }
.sequence-angle:nth-child(7) { animation-delay: 105ms; }
.sequence-angle:nth-child(9) { animation-delay: 140ms; }
.sequence-separator { color: rgba(202, 227, 250, .58); font-size: clamp(18px, 2vw, 30px); }
.screen-divider { height: 1px; background: rgba(204, 229, 255, .23); }
.screen-timer { position: relative; display: flex; align-items: center; justify-content: space-between; padding-top: clamp(18px, 3vh, 34px); }
.screen-timer span { color: rgba(232, 244, 255, .74); font: 500 clamp(12px, 1.2vw, 17px) 'DM Mono', ui-monospace, monospace; letter-spacing: .16em; }
.screen-timer strong { color: #fff; font: 500 clamp(28px, 3vw, 42px) 'DM Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(199, 230, 255, .3); }
.device-controls { display: grid; flex: 0 0 auto; gap: clamp(12px, 2vh, 22px); padding: clamp(20px, 3vh, 34px) 3px 4px; }
.duration-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 1vw, 14px); }
.duration-option { min-height: clamp(48px, 7vh, 70px); border: 1px solid rgba(223, 239, 255, .2); border-radius: 12px; color: #d8eaff; background: rgba(5, 25, 51, .13); cursor: pointer; font: 500 clamp(14px, 1.25vw, 18px) 'DM Mono', ui-monospace, monospace; transition: background .16s ease, border-color .16s ease, transform .16s ease; }
.duration-option:hover { border-color: rgba(255, 255, 255, .48); background: rgba(255, 255, 255, .09); }
.duration-option.is-selected { border-color: rgba(222, 241, 255, .82); color: #164475; background: #e7f3ff; box-shadow: 0 1px 4px rgba(3, 29, 63, .15); }
.generate-button { min-height: clamp(56px, 8vh, 82px); border: 1px solid rgba(224, 241, 255, .8); border-radius: 14px; color: #134477; background: linear-gradient(180deg, #fff, #dceeff); box-shadow: 0 3px 0 rgba(5, 27, 55, .22), inset 0 1px #fff; cursor: pointer; font-size: clamp(16px, 1.5vw, 22px); font-weight: 700; transition: transform .15s ease, filter .15s ease, box-shadow .15s ease; }
.generate-button:hover { filter: brightness(1.04); transform: translateY(-1px); }
.generate-button:active { box-shadow: 0 1px 0 rgba(5, 27, 55, .22); transform: translateY(2px); }
.bezel-bottom { display: flex; height: clamp(20px, 3vh, 32px); flex: 0 0 auto; align-items: end; justify-content: center; gap: 6px; padding-top: 10px; }
.bezel-bottom span { width: 5px; height: 5px; border-radius: 50%; background: rgba(217, 236, 255, .42); }
@keyframes angle-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 480px) {
  .workbench { padding: 3vh 3vw; }
  .device { width: 94vw; height: 88vh; height: 88svh; min-height: min(560px, 88svh); padding: 14px 12px 10px; border-radius: 24px; }
  .device-screen { padding: 22px 13px; }
  .sequence-output { min-height: 120px; gap: clamp(4px, 1.5vw, 8px); }
  .sequence-angle { font-size: clamp(19px, 6.2vw, 30px); }
  .sequence-separator { font-size: clamp(12px, 3.8vw, 18px); }
  .screen-timer strong { font-size: clamp(23px, 6vw, 32px); }
}
@media (max-height: 620px) {
  .device { height: 92vh; height: 92svh; min-height: 0; }
  .sequence-output { min-height: 72px; }
  .device-screen { padding-top: 16px; padding-bottom: 14px; }
  .device-controls { gap: 10px; padding-top: 12px; }
  .duration-option { min-height: 42px; }
  .generate-button { min-height: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

    </style>
  </head>
  <body>
    <main class="workbench">
      <section class="device" aria-label="Generador de secuencias">
        <div class="bezel-top" aria-hidden="true">
          <span class="device-name">ÁNGULOS</span>
          <span class="device-led"></span>
        </div>

        <div class="device-screen">
          <div class="screen-topline"><span>SECUENCIA</span><span class="screen-mark" aria-hidden="true">●</span></div>
          <div class="sequence-output" id="sequenceOutput" role="group" aria-label="Secuencia de ángulos"></div>
          <div class="screen-divider"></div>
          <div class="screen-timer">
            <span>TIEMPO</span>
            <strong id="timerDisplay" aria-live="off">00:30</strong>
          </div>
          <span class="sr-only" id="timerStatus" aria-live="polite"></span>
        </div>

        <div class="device-controls">
          <div class="duration-options" role="group" aria-label="Duración del temporizador">
            <button type="button" class="duration-option" data-seconds="10" aria-pressed="false">10 s</button>
            <button type="button" class="duration-option is-selected" data-seconds="30" aria-pressed="true">30 s</button>
            <button type="button" class="duration-option" data-seconds="60" aria-pressed="false">1 min</button>
          </div>
          <button class="generate-button" id="generateBtn" type="button">Otra secuencia</button>
        </div>
        <div class="bezel-bottom" aria-hidden="true"><span></span><span></span><span></span></div>
      </section>
      <div class="sr-only" id="liveRegion" aria-live="polite" aria-atomic="true"></div>
    </main>
    <script>
(() => {
  'use strict';

  const PIECES = [30, 60, 60, 90, 120];
  const DURATIONS = [10, 30, 60];
  const els = {
    output: document.getElementById('sequenceOutput'),
    timer: document.getElementById('timerDisplay'),
    timerStatus: document.getElementById('timerStatus'),
    generate: document.getElementById('generateBtn'),
    durationOptions: [...document.querySelectorAll('.duration-option')],
    live: document.getElementById('liveRegion')
  };
  const state = { sequence: [], duration: 30, remaining: 30, timer: null };

  function formatTime(seconds) {
    const minutes = Math.floor(seconds / 60).toString().padStart(2, '0');
    const remainder = (seconds % 60).toString().padStart(2, '0');
    return `${minutes}:${remainder}`;
  }

  function shuffle(values) {
    const result = [...values];
    for (let index = result.length - 1; index > 0; index -= 1) {
      const swap = Math.floor(Math.random() * (index + 1));
      [result[index], result[swap]] = [result[swap], result[index]];
    }
    return result;
  }

  function makeSequence() {
    let next = shuffle(PIECES);
    let attempts = 0;
    while (next.join(',') === state.sequence.join(',') && attempts < 12) {
      next = shuffle(PIECES);
      attempts += 1;
    }
    state.sequence = next;
    renderSequence();
  }

  function renderSequence() {
    els.output.replaceChildren();
    state.sequence.forEach((angle, index) => {
      const value = document.createElement('span');
      value.className = 'sequence-angle';
      value.textContent = `${angle}°`;
      els.output.append(value);
      if (index < state.sequence.length - 1) {
        const separator = document.createElement('span');
        separator.className = 'sequence-separator';
        separator.setAttribute('aria-hidden', 'true');
        separator.textContent = '·';
        els.output.append(separator);
      }
    });
    els.output.setAttribute('aria-label', `Secuencia: ${state.sequence.map((angle) => `${angle} grados`).join(', ')}`);
  }

  function renderTimer() {
    els.timer.textContent = formatTime(state.remaining);
  }

  function startTimer() {
    window.clearInterval(state.timer);
    state.remaining = state.duration;
    renderTimer();
    els.timerStatus.textContent = 'Temporizador iniciado.';
    state.timer = window.setInterval(() => {
      state.remaining = Math.max(0, state.remaining - 1);
      renderTimer();
      if (state.remaining === 0) {
        window.clearInterval(state.timer);
        state.timer = null;
        els.timerStatus.textContent = 'Tiempo terminado. Genera otra secuencia cuando quieras.';
      }
    }, 1000);
  }

  function announce(message) {
    els.live.textContent = '';
    window.setTimeout(() => { els.live.textContent = message; }, 30);
  }

  els.generate.addEventListener('click', () => {
    makeSequence();
    startTimer();
    announce(`Nueva secuencia: ${state.sequence.map((angle) => `${angle} grados`).join(', ')}.`);
  });

  els.durationOptions.forEach((button) => {
    button.addEventListener('click', () => {
      state.duration = Number(button.dataset.seconds);
      if (!DURATIONS.includes(state.duration)) return;
      els.durationOptions.forEach((option) => {
        const selected = option === button;
        option.classList.toggle('is-selected', selected);
        option.setAttribute('aria-pressed', String(selected));
      });
      startTimer();
    });
  });

  makeSequence();
  startTimer();
})();

    </script>
  </body>
</html>
